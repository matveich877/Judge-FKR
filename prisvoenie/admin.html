<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Присвоение КТСС</title>
</head>
<body>
<noscript><p style="font-family:sans-serif;padding:40px">Для работы админ-панели нужен включённый JavaScript.</p></noscript>
<p id="ld" style="font-family:sans-serif;padding:40px;color:#6b7280">Загрузка…</p>
<script>
Promise.all(['admin_asm/part01','admin_asm/part02','admin_asm/part03','admin_asm/part04','admin_asm/part05','admin_asm/part06','admin_asm/part07','admin_asm/part08','admin_asm/part09']
  .map(function(p){return fetch(p,{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw new Error(p+': '+r.status);return r.text()})}))
.then(function(a){
  document.open();document.write(a.join(''));document.close();
})
.catch(function(e){
  document.getElementById('ld').innerHTML='Не удалось загрузить админ-панель.<br>1) Обновите страницу (Ctrl+F5).<br>2) Если не помогло — откройте в современном браузере (Chrome, Edge, Firefox, Safari 16.4+).<br>3) Или напишите: <a href="mailto:matveich87@yandex.ru">matveich87@yandex.ru</a> / Telegram @matveich877';
});
</script>
</body>
</html>
